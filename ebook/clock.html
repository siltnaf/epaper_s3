<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>时钟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .clock-page {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部状态栏 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #fff;
      font-size: 14px;
    }
    .status-bar .icon { font-size: 18px; }

    /* 时钟区域 - 占据上半部分 */
    .clock-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #fff;
    }
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #666;
      margin-bottom: 15px;
    }

    /* 模拟时钟画布 */
    .clock-canvas-wrap {
      margin-bottom: 10px;
    }
    .clock-canvas-wrap canvas {
      border-radius: 50%;
    }

    /* 数字时钟 */
    .clock-digital {
      text-align: center;
    }
    .clock-time {
      font-size: 42px;
      font-weight: 700;
      color: #333;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
    }
    .clock-date {
      font-size: 16px;
      color: #666;
      margin-top: 5px;
    }

    /* 位置区域 */
    .location-section {
      background: #fff;
      padding: 15px;
      text-align: center;
      border-top: 1px solid #eee;
    }
    .location-title {
      font-size: 16px;
      color: #888;
      margin-bottom: 5px;
    }
    .location-city {
      font-size: 26px;
      font-weight: 600;
      color: #333;
      line-height: 1.2;
      font-family: inherit;
      word-break: keep-all;
    }

    /* 天气区域 - 占据下半部分 */
    .weather-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 20px;
      border-top: 1px solid #eee;
    }
    .weather-title {
      font-size: 16px;
      color: #888;
      margin-bottom: 10px;
    }
    .weather-box {
      text-align: center;
      width: 100%;
      padding: 15px;
      border: 2px solid #333;
      border-radius: 8px;
    }
    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .weather-icon {
      font-size: 40px;
    }
    .weather-temp {
      font-size: 36px;
      font-weight: 700;
    }
    .weather-desc {
      font-size: 20px;
      color: #666;
      margin-bottom: 8px;
    }
    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 6px 12px;
      font-size: 13px;
      line-height: 1.25;
      color: #666;
      font-family: inherit;
      width: 100%;
    }
    .weather-detail {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      white-space: nowrap;
      font-family: inherit;
    }
    .weather-detail-label {
      font-size: 13px;
      font-weight: 400;
      color: #777;
      font-family: inherit;
    }
    .weather-detail-value {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      font-family: inherit;
    }
    .weather-empty {
      font-size: 16px;
      color: #999;
    }

    /* 加载状态 */
    .loading {
      color: #999;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="clock-page">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
      <span class="icon">🏠</span>
      <span class="icon" id="wifi-icon">📶</span>
      <span class="icon" id="battery-icon">🔋</span>
    </div>

    <!-- 时钟区域 -->
    <div class="clock-section">
      <div class="section-title" id="clock-title">本地时钟</div>
      <div class="clock-canvas-wrap" id="clock-canvas-container"></div>
      <div class="clock-digital">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">加载中...</div>
      </div>
    </div>

    <!-- 位置区域 -->
    <div class="location-section">
      <div class="location-title" id="location-title">当前位置</div>
      <div class="location-city" id="location-city">获取中...</div>
    </div>

    <!-- 天气区域 -->
    <div class="weather-section">
      <div class="weather-title" id="weather-title">当地天气</div>
      <div class="weather-box" id="weather-box">
        <div class="loading" id="weather-loading">获取天气中...</div>
      </div>
    </div>
  </div>

  <script>
    // 配置
    const API_BASE = window.location.origin;

    // 状态
    let clockTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai';
    let clockAnimFrame = null;
    let lastUpdateTime = 0;
    let lastWeatherData = null;

    // 城市名称翻译
    const cityZhMap = {
      'Shenzhen': '深圳', 'Shanghai': '上海', 'Beijing': '北京',
      'Guangzhou': '广州', 'Hangzhou': '杭州', 'Chengdu': '成都',
      'Wuhan': '武汉', 'Nanjing': '南京', 'Tianjin': '天津',
      'Chongqing': '重庆', 'Suzhou': '苏州', "Xi'an": '西安',
      'Changsha': '长沙', 'Zhengzhou': '郑州', 'Dongguan': '东莞',
      'Qingdao': '青岛', 'Shenyang': '沈阳', 'Ningbo': '宁波',
      'Kunming': '昆明', 'Dalian': '大连', 'Xiamen': '厦门',
      'Fuzhou': '福州', 'Hefei': '合肥', 'Wuxi': '无锡',
      'Foshan': '佛山', 'Changzhou': '常州', 'Jinan': '济南',
      'Harbin': '哈尔滨', 'Changchun': '长春', 'Lanzhou': '兰州',
      'Guiyang': '贵阳', 'Nanning': '南宁', 'Taiyuan': '太原',
      'Shijiazhuang': '石家庄', 'Haikou': '海口', 'Sanya': '三亚',
      'Macau': '澳门', 'Hong Kong': '香港', 'Taipei': '台北',
      'Matso Lung': '马草垄', 'Ma Tso Lung': '马草垄',
      'MaTsoLung': '马草垄', 'MaTsoLurg': '马草垄',
      'Ma Tso Lurg': '马草垄', 'Ma Tso': '马草垄'
    };

    // 天气描述翻译
    const weatherDescZhMap = {
      'Sunny': '晴', 'Clear': '晴', 'Partly cloudy': '多云',
      'Cloudy': '多云', 'Overcast': '阴', 'Light rain': '小雨',
      'Rain': '雨', 'Heavy rain': '大雨', 'Thunderstorm': '雷暴',
      'Snow': '雪', 'Light snow': '小雪', 'Heavy snow': '大雪',
      'Fog': '雾', 'Mist': '薄雾', 'Windy': '大风',
      'Hot': '炎热', 'Cold': '寒冷', 'Warm': '温暖'
    };

    function decodeApiText(value) {
      if (value === null || value === undefined) return '';
      let text = String(value).trim();
      try {
        if (/%[0-9A-Fa-f]{2}/.test(text)) text = decodeURIComponent(text);
      } catch (e) {
        console.warn('API文本解码失败:', e);
      }
      const textarea = document.createElement('textarea');
      textarea.innerHTML = text;
      return textarea.value.trim();
    }

    function normalizeCityName(city) {
      return decodeApiText(city)
        .replace(/\s+/g, ' ')
        .replace(/lurg/ig, 'Lung')
        .trim();
    }

    function translateCity(en) {
      const city = normalizeCityName(en);
      if (!city) return '';
      if (cityZhMap[city]) return cityZhMap[city];
      const compactCity = city.replace(/\s+/g, '');
      return cityZhMap[compactCity] || city;
    }

    function translateWeatherDesc(en) {
      const desc = decodeApiText(en);
      return weatherDescZhMap[desc] || desc;
    }

    // 获取天气图标
    function getWeatherIcon(desc) {
      const d = desc.toLowerCase();
      if (d.includes('晴') || d.includes('clear')) return '☀️';
      if (d.includes('多云') || d.includes('cloud')) return '⛅';
      if (d.includes('阴') || d.includes('overcast')) return '☁️';
      if (d.includes('雨') || d.includes('rain')) return '🌧️';
      if (d.includes('雷') || d.includes('thunder')) return '⛈️';
      if (d.includes('雪') || d.includes('snow')) return '❄️';
      if (d.includes('雾') || d.includes('fog')) return '🌫️';
      return '🌤️';
    }

    // API 1: 时钟数据
    async function fetchClockData() {
      try {
        const res = await fetch(API_BASE + '/api/clock');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.timezone) {
          clockTimezone = data.timezone;
        }
      } catch (e) {
        console.warn('时钟API请求失败:', e);
      }
    }

    // API 2: 位置数据
    async function fetchLocationData() {
      const cityEl = document.getElementById('location-city');

      try {
        const res = await fetch(API_BASE + '/api/location');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.message) {
          cityEl.textContent = translateCity(data.message) || decodeApiText(data.message);
        } else if (data.city) {
          cityEl.textContent = translateCity(data.city);
        } else {
          const parts = clockTimezone.split('/');
          const city = parts[parts.length - 1].replace(/_/g, ' ');
          cityEl.textContent = translateCity(city) || '当前位置';
        }
      } catch (e) {
        console.warn('位置API请求失败:', e);
        const parts = clockTimezone.split('/');
        const city = parts[parts.length - 1].replace(/_/g, ' ');
        cityEl.textContent = translateCity(city) || '当前位置';
      }
    }

    // API 3: 天气数据 - 局部刷新
    async function fetchWeatherData() {
      const weatherBox = document.getElementById('weather-box');

      try {
        const res = await fetch(API_BASE + '/api/weather');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        // 检查数据是否变化，只更新变化的部分
        const weatherKey = JSON.stringify({
          temp: data.temp,
          desc: data.desc,
          humidity: data.humidity,
          wind: data.wind,
          city: data.city
        });

        if (weatherKey !== lastWeatherData) {
          lastWeatherData = weatherKey;

          const descZh = translateWeatherDesc(data.desc || '');
          const icon = getWeatherIcon(descZh);
          // 只更新天气框内容
          weatherBox.innerHTML = `
            <div class="weather-main">
              <span class="weather-icon">${icon}</span>
              <span class="weather-temp">${data.temp}°C</span>
            </div>
            <div class="weather-desc">${descZh}</div>
            <div class="weather-details">
              <span class="weather-detail"><span class="weather-detail-label">湿度</span><span class="weather-detail-value">${decodeApiText(data.humidity)}%</span></span>
              <span class="weather-detail"><span class="weather-detail-label">风速</span><span class="weather-detail-value">${decodeApiText(data.wind)}</span><span class="weather-detail-label">公里/时</span></span>
            </div>
          `;
        }
      } catch (e) {
        console.warn('天气API请求失败:', e);
        weatherBox.innerHTML = '<div class="weather-empty">暂时无法获取天气</div>';
      }
    }

    // 时钟显示更新 - 局部刷新
    function updateClockDisplay() {
      const now = new Date();
      const tz = clockTimezone || Intl.DateTimeFormat().resolvedOptions().timeZone;

      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: tz,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(now);

      const h = parts.find(p => p.type === 'hour').value;
      const m = parts.find(p => p.type === 'minute').value;
      const s = parts.find(p => p.type === 'second').value;

      // 只更新时间文本
      const timeEl = document.getElementById('clock-time');
      if (timeEl.textContent !== h + ':' + m + ':' + s) {
        timeEl.textContent = h + ':' + m + ':' + s;
      }

      // 更新日期
      const dateStr = new Intl.DateTimeFormat('zh-CN', {
        timeZone: tz,
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      }).format(now);

      const dateEl = document.getElementById('clock-date');
      if (dateEl.textContent !== dateStr) {
        dateEl.textContent = dateStr;
      }
    }

    // 绘制模拟时钟 - 只在需要时重绘
    function drawAnalogClock() {
      const container = document.getElementById('clock-canvas-container');
      if (!container) return;

      let canvas = container.querySelector('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        // 增大时钟尺寸
        const size = Math.min(container.clientWidth || 300, 300);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        container.appendChild(canvas);
      }

      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      const tz = clockTimezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const now = new Date();
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: tz,
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(now);

      const hour = parseInt(parts.find(p => p.type === 'hour').value);
      const minute = parseInt(parts.find(p => p.type === 'minute').value);
      const second = parseInt(parts.find(p => p.type === 'second').value);

      // 清除画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 时钟外圈
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 时钟背景
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      // 小时刻度
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const innerR = i % 3 === 0 ? radius - 20 : radius - 12;
        const outerR = radius - 4;
        ctx.beginPath();
        ctx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
        ctx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
        ctx.strokeStyle = i % 3 === 0 ? '#333' : '#666';
        ctx.lineWidth = i % 3 === 0 ? 3 : 1.5;
        ctx.stroke();
      }

      // 分钟刻度
      for (let i = 0; i < 60; i++) {
        if (i % 5 !== 0) {
          const angle = (i * 6 - 90) * Math.PI / 180;
          const innerR = radius - 8;
          const outerR = radius - 4;
          ctx.beginPath();
          ctx.moveTo(cx + innerR * Math.cos(angle), cy + innerR * Math.sin(angle));
          ctx.lineTo(cx + outerR * Math.cos(angle), cy + outerR * Math.sin(angle));
          ctx.strokeStyle = '#999';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // 数字 (使用中文数字或阿拉伯数字)
      ctx.fillStyle = '#333';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const numR = radius - 32;
        ctx.fillText(i.toString(), cx + numR * Math.cos(angle), cy + numR * Math.sin(angle));
      }

      // 时针
      const hourAngle = ((hour % 12) * 30 + minute * 0.5 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + (radius * 0.45) * Math.cos(hourAngle), cy + (radius * 0.45) * Math.sin(hourAngle));
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 分针
      const minAngle = (minute * 6 + second * 0.1 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + (radius * 0.65) * Math.cos(minAngle), cy + (radius * 0.65) * Math.sin(minAngle));
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 秒针
      const secAngle = (second * 6 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx - 12 * Math.cos(secAngle), cy - 12 * Math.sin(secAngle));
      ctx.lineTo(cx + (radius * 0.75) * Math.cos(secAngle), cy + (radius * 0.75) * Math.sin(secAngle));
      ctx.strokeStyle = '#c00';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 中心点
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#333';
      ctx.fill();
    }

    // 时钟循环 - 优化刷新
    let lastDrawnSecond = -1;
    function startClockLoop() {
      if (clockAnimFrame) cancelAnimationFrame(clockAnimFrame);

      function update() {
        const now = new Date();
        const tz = clockTimezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
        const parts = new Intl.DateTimeFormat('zh-CN', {
          timeZone: tz,
          second: '2-digit'
        }).formatToParts(now);
        const currentSecond = parseInt(parts.find(p => p.type === 'second').value);

        // 只在秒数变化时重绘
        if (currentSecond !== lastDrawnSecond) {
          lastDrawnSecond = currentSecond;
          updateClockDisplay();
          drawAnalogClock();
        }

        clockAnimFrame = requestAnimationFrame(update);
      }
      update();
    }

    // 主函数
    async function fetchAllData() {
      await Promise.all([
        fetchClockData(),
        fetchLocationData(),
        fetchWeatherData()
      ]);
    }

    // 初始化
    async function init() {
      // 首次加载所有数据
      await fetchAllData();

      // 启动时钟
      startClockLoop();

      // 每10分钟刷新天气
      setInterval(fetchWeatherData, 10 * 60 * 1000);

      // 每分钟刷新位置
      setInterval(fetchLocationData, 60 * 1000);
    }

    // 启动
    init();
  </script>
</body>
</html>
